name: Build Image

on:
    workflow_call:
        inputs:
            ref:
                required: true
                type: string
            image_tag:
                required: true
                type: string
            version:
                required: false
                type: string
                default: ''
        outputs:
            image:
                value: ${{ jobs.build.outputs.image }}
            digest:
                value: ${{ jobs.build.outputs.digest }}
            source_sha:
                value: ${{ jobs.build.outputs.source_sha }}

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.meta.outputs.image }}
            digest: ${{ steps.publish.outputs.digest }}
            source_sha: ${{ steps.meta.outputs.source_sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0
            - name: Resolve source metadata
              id: meta
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  source_sha=$(git rev-parse HEAD)
                  printf 'image=%s\nsource_sha=%s\n' "$image" "$source_sha" >> "$GITHUB_OUTPUT"
                  printf 'IMAGE=%s\nSOURCE_SHA=%s\n' "$image" "$source_sha" >> "$GITHUB_ENV"
                  if [ -n "$VERSION" ]; then printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"; fi
            - uses: ./.github/actions/setup-podman
            - name: Build OCI image
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  podman build --format oci --file Containerfile \
                    --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                    --label "org.opencontainers.image.revision=$SOURCE_SHA" \
                    --label "org.opencontainers.image.version=${VERSION:-$IMAGE_TAG}" \
                    --tag "$IMAGE:$IMAGE_TAG" .
            - name: Smoke test image
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  sh scripts/smoke-test-image.sh "$IMAGE:$IMAGE_TAG"
            - name: Export image
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: podman save --format docker-archive "$IMAGE:$IMAGE_TAG" --output "$RUNNER_TEMP/image.tar"
            - name: Report image size
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  {
                    echo '## Image size'
                    echo
                    echo "- Image: $(podman image inspect --format '{{.Size}} bytes' "$IMAGE:$IMAGE_TAG")"
                    echo "- Archive: $(du -h "$RUNNER_TEMP/image.tar" | cut -f1)"
                    echo "- node_modules: $(podman run --rm --entrypoint sh "$IMAGE:$IMAGE_TAG" -c 'du -sh /app/node_modules | cut -f1')"
                    echo "- dist: $(podman run --rm --entrypoint sh "$IMAGE:$IMAGE_TAG" -c 'du -sh /app/dist | cut -f1')"
                    echo "- migrations: $(podman run --rm --entrypoint sh "$IMAGE:$IMAGE_TAG" -c 'du -sh /app/migrations | cut -f1')"
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Scan image vulnerabilities
              env:
                  TRIVY_IMAGE: docker.io/aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
              run: |
                  podman run --rm --volume "$RUNNER_TEMP:/workspace:ro" "$TRIVY_IMAGE" image \
                    --input /workspace/image.tar --scanners vuln --severity CRITICAL --ignore-unfixed \
                    --exit-code 1 --no-progress --timeout 5m
            - name: Generate SPDX SBOM
              env:
                  SYFT_IMAGE: docker.io/anchore/syft@sha256:600896ff278677fb13b16dc35999452f4e79636fc098c9fee6ce3cffef9858e2
              run: |
                  podman run --rm --volume "$RUNNER_TEMP:/workspace" "$SYFT_IMAGE" scan \
                    docker-archive:/workspace/image.tar --output spdx-json=/workspace/image.sbom.spdx.json
            - name: Login to GHCR
              run: printf '%s' '${{ github.token }}' | podman login ghcr.io --username '${{ github.actor }}' --password-stdin
            - name: Publish image
              id: publish
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$IMAGE_TAG" "docker://$IMAGE:$IMAGE_TAG"
                  printf 'digest=%s\n' "$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: v3.1.3
            - name: Check Cosign version
              run: cosign version
            - name: Sign image and attach SBOM
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
                  DIGEST: ${{ steps.publish.outputs.digest }}
              run: |
                  printf '%s' '${{ github.token }}' | cosign login ghcr.io --username '${{ github.actor }}' --password-stdin
                  cosign sign --yes "$IMAGE@$DIGEST"
                  cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/image.sbom.spdx.json" "$IMAGE@$DIGEST"
