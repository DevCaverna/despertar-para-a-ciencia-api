name: Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: SemVer without the v prefix
                required: true
                type: string

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
    preflight:
        needs: ci
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - uses: ./.github/actions/setup-node-pnpm
            - id: meta
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  [ "$GITHUB_REF" = 'refs/heads/main' ] || { echo 'release must be started from main' >&2; exit 1; }
                  node -e "const semver=require('semver'); if (!semver.valid(process.env.VERSION) || process.env.VERSION.includes('+')) process.exit(1)"
                  git fetch origin main --tags
                  [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo 'main advanced; run the release again' >&2; exit 1; }
                  git show-ref --verify --quiet "refs/tags/v$VERSION" && { echo 'release tag already exists' >&2; exit 1; } || true
                  ! grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo 'version already exists in changelog' >&2; exit 1; }
                  printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
    prepare:
        needs: preflight
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            release_sha: ${{ steps.meta.outputs.release_sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - uses: ./.github/actions/setup-node-pnpm
            - id: meta
              env:
                  VERSION: ${{ inputs.version }}
                  RELEASE_DATE: ${{ github.event.repository.updated_at }}
              run: |
                  RELEASE_DATE="$(date -u +%F)" node scripts/prepare-release.mjs "$VERSION"
                  [ "$(git diff --name-only)" = $'CHANGELOG.md\npackage.json' ] || { echo 'prepare-release changed unexpected files' >&2; exit 1; }
                  pnpm build
                  git fetch origin main
                  [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo 'main advanced; run the release again' >&2; exit 1; }
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add package.json CHANGELOG.md
                  git commit --message "chore(release): v$VERSION"
                  release_sha=$(git rev-parse HEAD)
                  git tag --annotate "v$VERSION" --message "Release v$VERSION"
                  git push --atomic origin HEAD:main "v$VERSION"
                  printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
                  printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
    build:
        needs: [preflight, prepare]
        uses: ./.github/workflows/build-image.yml
        with:
            ref: ${{ needs.prepare.outputs.tag }}
            image_tag: ${{ needs.prepare.outputs.tag }}
            version: ${{ inputs.version }}
    github-release:
        needs: [prepare, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - name: Extract release notes
              env:
                  VERSION: ${{ inputs.version }}
              run: node scripts/extract-release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
            - env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.prepare.outputs.tag }}
                  VERSION: ${{ inputs.version }}
              run: |
                  release_args=(
                    "$TAG"
                    --verify-tag
                    --title "$TAG"
                    --notes-file "$RUNNER_TEMP/release-notes.md"
                  )
                  case "$VERSION" in
                    *-*) release_args+=(--prerelease) ;;
                  esac
                  gh release create "${release_args[@]}"
