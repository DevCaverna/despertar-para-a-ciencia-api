name: Setup Podman
description: Ensure Podman is available on the GitHub Actions runner.
runs:
    using: composite
    steps:
        - name: Install Podman
          shell: bash
          run: |
              set -euo pipefail
              if ! command -v podman >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install --yes --no-install-recommends podman
              fi
              podman version
